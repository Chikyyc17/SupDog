<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Panel de Cocina - SupDog | Comandas en Tiempo Real</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #DB3606, #F8A814);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            font-size: 2rem;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #F8A814;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #ccc;
        }

        .orders-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: linear-gradient(145deg, #2a2a2a, #222);
            border-radius: 16px;
            overflow: hidden;
            border-left: 5px solid #F8A814;
            transition: all 0.3s ease;
            animation: fadeInUp 0.3s ease;
        }

        .order-card.new {
            animation: blink 0.5s ease;
            border-left-color: #DB3606;
        }

        @keyframes blink {
            0% { background: #4a3a2a; transform: scale(1.02); }
            100% { background: #2a2a2a; transform: scale(1); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-header {
            background: rgba(248, 168, 20, 0.1);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .order-id {
            font-weight: bold;
            font-size: 1.1rem;
            color: #F8A814;
        }

        .order-id i {
            margin-right: 5px;
        }

        .order-time {
            font-size: 0.8rem;
            color: #aaa;
            font-family: monospace;
        }

        .order-location {
            background: #DB3606;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .order-body {
            padding: 15px;
        }

        .order-items {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .item-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-name i {
            color: #F8A814;
            font-size: 0.8rem;
        }

        .item-quantity {
            background: #F8A814;
            color: #1a1a1a;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        .item-price {
            color: #F8A814;
            font-weight: bold;
        }

        .order-total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid rgba(248, 168, 20, 0.3);
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .total-amount {
            color: #F8A814;
            font-size: 1.3rem;
        }

        .order-footer {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
        }

        .btn-complete {
            flex: 1;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-top: 50px;
        }

        .empty-state i {
            font-size: 4rem;
            color: #F8A814;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #aaa;
        }

        .alert-sound {
            display: none;
        }

        @media (max-width: 768px) {
            .orders-container {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .stats {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>
            <i class="fas fa-utensils"></i>
            Panel de Cocina - SupDog
        </h1>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pedidos Pendientes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">Hoy</div>
            </div>
        </div>
    </div>

    <div id="ordersContainer" class="orders-container">
        <div class="empty-state">
            <i class="fas fa-check-circle"></i>
            <h3>¡Todo listo!</h3>
            <p>No hay pedidos pendientes. Esperando nuevos pedidos...</p>
            <p style="margin-top: 15px; font-size: 0.9rem;">
                <i class="fas fa-qrcode"></i> Los pedidos de los clientes aparecerán aquí automáticamente
            </p>
        </div>
    </div>

    <audio id="notificationSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>

    <script>
        let orders = [];
        let lastOrderCount = 0;

        // Cargar órdenes de localStorage
        function loadOrders() {
            const savedOrders = localStorage.getItem('kitchen_orders');
            if (savedOrders) {
                orders = JSON.parse(savedOrders);
                // Filtrar solo pedidos pendientes (no completados)
                orders = orders.filter(order => order.status !== 'completed');
                renderOrders();
                updateStats();
                
                // Reproducir sonido si hay nuevas órdenes
                if (orders.length > lastOrderCount) {
                    playNotificationSound();
                    lastOrderCount = orders.length;
                }
            } else {
                orders = [];
                renderEmptyState();
                updateStats();
            }
        }

        // Completar un pedido
        function completeOrder(orderId) {
            // Marcar como completado
            const orderIndex = orders.findIndex(o => o.id === orderId);
            if (orderIndex !== -1) {
                orders[orderIndex].status = 'completed';
                
                // Actualizar localStorage
                const allOrders = JSON.parse(localStorage.getItem('kitchen_orders') || '[]');
                const updatedOrders = allOrders.map(o => 
                    o.id === orderId ? { ...o, status: 'completed' } : o
                );
                localStorage.setItem('kitchen_orders', JSON.stringify(updatedOrders));
                
                // Recargar vista
                loadOrders();
                
                // Mostrar notificación visual
                showToast('Pedido completado', '✅');
            }
        }

        // Renderizar órdenes
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const pendingOrders = orders.filter(o => o.status === 'pending');
            
            if (pendingOrders.length === 0) {
                renderEmptyState();
                return;
            }
            
            container.innerHTML = pendingOrders.map(order => `
                <div class="order-card ${order.read ? '' : 'new'}" data-order-id="${order.id}">
                    <div class="order-header">
                        <div class="order-id">
                            <i class="fas fa-receipt"></i> ${order.id}
                        </div>
                        <div class="order-time">
                            <i class="fas fa-clock"></i> ${formatTime(order.timestamp)}
                        </div>
                        <div class="order-location">
                            <i class="fas fa-map-marker-alt"></i> ${order.location || 'Grapevine'}
                        </div>
                    </div>
                    <div class="order-body">
                        <div class="order-items">
                            ${order.items.map(item => `
                                <div class="order-item">
                                    <div class="item-name">
                                        <i class="fas fa-hotdog"></i>
                                        ${item.name}
                                        <span class="item-quantity">x${item.quantity}</span>
                                    </div>
                                    <div class="item-price">$${item.subtotal.toFixed(2)}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="order-total">
                            <span>TOTAL</span>
                            <span class="total-amount">$${order.total.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="order-footer">
                        <button class="btn-complete" onclick="completeOrder('${order.id}')">
                            <i class="fas fa-check-circle"></i> Pedido Listo
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Marcar como leídas
            orders.forEach(order => {
                if (!order.read) {
                    order.read = true;
                }
            });
        }

        function renderEmptyState() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-check-circle"></i>
                    <h3>¡Todo listo!</h3>
                    <p>No hay pedidos pendientes. Esperando nuevos pedidos...</p>
                    <p style="margin-top: 15px; font-size: 0.9rem;">
                        <i class="fas fa-qrcode"></i> Los pedidos de los clientes aparecerán aquí automáticamente
                    </p>
                </div>
            `;
        }

        function updateStats() {
            const pendingCount = orders.filter(o => o.status === 'pending').length;
            document.getElementById('pendingCount').textContent = pendingCount;
            
            // Contar pedidos de hoy
            const today = new Date().toDateString();
            const allOrders = JSON.parse(localStorage.getItem('kitchen_orders') || '[]');
            const todayOrders = allOrders.filter(o => {
                const orderDate = new Date(o.timestamp).toDateString();
                return orderDate === today;
            });
            document.getElementById('todayCount').textContent = todayOrders.length;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        }

        function playNotificationSound() {
            const audio = document.getElementById('notificationSound');
            if (audio) {
                audio.play().catch(e => console.log('Autoplay bloqueado, esperando interacción'));
            }
            
            // También mostrar notificación del navegador si está permitido
            if (Notification.permission === 'granted') {
                new Notification('🍔 Nuevo Pedido SupDog', {
                    body: 'Hay un nuevo pedido en la cocina',
                    icon: 'https://via.placeholder.com/64'
                });
            }
        }

        function showToast(message, icon) {
            // Crear toast temporal
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #4CAF50;
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                z-index: 1000;
                animation: fadeInUp 0.3s ease;
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: bold;
            `;
            toast.innerHTML = `${icon} ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Escuchar cambios en localStorage (para recibir pedidos en tiempo real)
        window.addEventListener('storage', function(e) {
            if (e.key === 'kitchen_orders') {
                loadOrders();
                playNotificationSound();
            }
            if (e.key === 'kitchen_alert') {
                playNotificationSound();
            }
        });

        // Solicitar permiso para notificaciones
        if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }

        // Cargar órdenes al inicio
        loadOrders();
        
        // Actualizar cada 2 segundos por si acaso
        setInterval(loadOrders, 2000);
        
        console.log('👨‍🍳 Panel de Cocina listo!');
        console.log('Esperando pedidos...');
    </script>
</body>
</html>
