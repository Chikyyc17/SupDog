<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ==================== CONFIGURACIÓN SUPABASE ====================
// REEMPLAZA ESTOS VALORES CON LOS TUYOS
const SUPABASE_URL = 'https://supdogdfw.supabase.co';  // ← CAMBIA ESTO
const SUPABASE_ANON_KEY = 'sb_publishable_8jMfYjBtLbshlvvwWEbKUQ_ebayqE7U';        // ← CAMBIA ESTO

// Inicializar Supabase
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ==================== FUNCIÓN PARA GUARDAR PEDIDO EN LA NUBE ====================
async function sendOrderToKitchen(orderData) {
    try {
        console.log('📤 Enviando pedido a la nube...', orderData);
        
        // Preparar datos para Supabase
        const orderToSave = {
            order_id: orderData.orderId,
            customer_name: 'Cliente QR',
            table_number: 'Mesa QR',
            items: orderData.items,
            total: orderData.total,
            location: orderData.location,
            status: 'pending'
        };
        
        // Guardar en Supabase
        const { data, error } = await supabase
            .from('orders')
            .insert([orderToSave])
            .select();
        
        if (error) {
            console.error('❌ Error en Supabase:', error);
            showNotification('Error al enviar pedido. Contacta al personal.', true);
            return { success: false, error: error.message };
        }
        
        console.log('✅ Pedido guardado en la nube:', data);
        showNotification(`✅ Pedido #${orderData.orderId.slice(-6)} enviado a cocina!`);
        
        return { success: true, orderId: orderData.orderId };
        
    } catch (error) {
        console.error('❌ Error al enviar pedido:', error);
        showNotification('Error al enviar pedido. Contacta al personal.', true);
        return { success: false, error: error.message };
    }
}

// ==================== MODIFICAR LA FUNCIÓN CHECKOUT ====================
// Reemplaza la función checkout existente con esta versión async
async function checkout() {
    if (cart.length === 0) {
        showNotification('El carrito está vacío', true);
        return;
    }
    
    const total = getCartTotal();
    const currentLocation = document.querySelector('.location-btn.active')?.innerText.includes('Grapevine') ? 'Grapevine' : 'Allen';
    
    showNotification('Procesando pago...');
    
    try {
        // 1. Simular pago (aquí va tu integración real con SHAZE BANK)
        const paymentResult = await processPayment(total, cart);
        
        if (!paymentResult.success) {
            showNotification('Error en el pago. Intenta nuevamente', true);
            return;
        }
        
        showNotification(`✅ Pago aprobado!`);
        
        // 2. Preparar datos para cocina
        const orderData = {
            orderId: paymentResult.transactionId,
            items: cart.map(item => ({
                name: item.name,
                quantity: item.quantity,
                price: item.price,
                subtotal: item.price * item.quantity
            })),
            total: total,
            location: currentLocation,
            tableNumber: 'QR-MESA',
            paymentId: paymentResult.transactionId,
            paymentConfirmed: true
        };
        
        // 3. Enviar a cocina (AHORA A LA NUBE)
        const kitchenResult = await sendOrderToKitchen(orderData);
        
        if (kitchenResult.success) {
            // 4. Limpiar carrito
            cart = [];
            saveCart();
            
            // 5. Cerrar modal
            document.getElementById('cartModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            
            // 6. Mostrar mensaje de éxito
            showNotification(`🎉 Pedido enviado a cocina! Tu comida estará lista pronto.`);
            
        } else {
            showNotification('Error al enviar a cocina. Contacta al personal', true);
        }
        
    } catch (error) {
        console.error('Error en checkout:', error);
        showNotification('Error al procesar el pedido', true);
    }
}
</script>
