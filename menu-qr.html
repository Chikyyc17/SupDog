    <style>
        :root {
            --color-rojo-fuego: #DB3606;
            --color-amarillo-cheddar: #F8A814;
            --color-purpura-berry: #BA6990;
            --color-fondo-oscuro: #0f0f0f;
            --color-texto-claro: #ffffff;
            --color-exito: #4CAF50;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-fondo-oscuro);
            color: var(--color-texto-claro);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8rem 5%;
            background-color: rgba(15, 15, 15, 0.98);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            height: 70px;
            border-bottom: 3px solid var(--color-amarillo-cheddar);
        }

        .logo-text {
            font-size: 2rem;
            cursor: pointer;
            color: white;
            text-shadow: 2px 2px 0px var(--color-rojo-fuego);
            font-family: 'Bangers', cursive;
        }

        .logo-text span {
            color: var(--color-amarillo-cheddar);
        }

        .cart-btn {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, var(--color-purpura-berry), #9d5b85);
            padding: 8px 16px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-count {
            background: var(--color-rojo-fuego);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .cart-modal {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--color-fondo-oscuro);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.active {
            transform: translateX(0);
        }

        .cart-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(186,105,144,0.2), rgba(219,54,6,0.1));
            border-bottom: 2px solid var(--color-purpura-berry);
            position: relative;
        }

        .cart-header h2 {
            color: var(--color-amarillo-cheddar);
            text-align: center;
        }

        .close-cart {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .cart-footer {
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(186,105,144,0.2), rgba(219,54,6,0.1));
            border-top: 2px solid var(--color-purpura-berry);
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--color-purpura-berry), #9d5b85);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .menu-section {
            padding: 5rem 1.5rem 2rem;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(219,54,6,0.15), rgba(186,105,144,0.15));
            border-radius: 24px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
            border: 1px solid rgba(248,168,20,0.3);
        }

        .hero-banner h1 {
            font-size: 2rem;
            font-family: 'Bangers', cursive;
            color: var(--color-amarillo-cheddar);
            text-shadow: 2px 2px 0px var(--color-rojo-fuego);
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            color: var(--color-amarillo-cheddar);
            margin-bottom: 1rem;
            font-family: 'Bangers', cursive;
        }

        .section-title:after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: var(--color-rojo-fuego);
            margin: 0.5rem auto;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;

        .menu-card {
            background: linear-gradient(145deg, #2a2a2a, #222);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid rgba(248,168,20,0.2);
        }

            transform: translateY(-5px);
            border-color: var(--color-amarillo-cheddar);
        }

        .card-image {
            width: 100%;
            height: 180px;

        .card-content {

            color: var(--color-amarillo-cheddar);
            margin-bottom: 0.5rem;

        }

            margin-top: 0.5rem;

            padding: 8px 16px;
            border-radius: 25px;

            align-items: center;

        .badge {

            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 5px;
        }

        .brunch-banner {
            background: linear-gradient(135deg, var(--color-purpura-berry), var(--color-rojo-fuego));
            text-align: center;
            padding: 0.6rem;
            border-radius: 40px;
            margin: 1rem auto;
            max-width: 500px;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-exito);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 5000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .empty-cart {
            text-align: center;
            padding: 2rem;
            color: #aaa;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #0a0a0a;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: 1fr; }
            .cart-modal { max-width: 100%; }
            .hero-banner h1 { font-size: 1.6rem; }
            .cart-btn span:not(.cart-count) { display: none; }
            .cart-btn { padding: 8px 12px; }
        }
    </style>
</head>

        ];
        
        // ==================== CARRITO ====================
        let shoppingCart = JSON.parse(localStorage.getItem('lucysyard_cart')) || [];
        
        function saveCartToLocal() {
            localStorage.setItem('lucysyard_cart', JSON.stringify(shoppingCart));
            updateCartUI();
        }
        
        function addItemToCart(item) {
            const existing = shoppingCart.find(i => i.id === item.id);
            if (existing) {
                existing.quantity++;
            } else {
                shoppingCart.push({ ...item, quantity: 1 });
            }
            saveCartToLocal();
            showNotification(`${item.name} agregado al carrito`);
        }
        
        function removeItemFromCart(index) {
            shoppingCart.splice(index, 1);
            saveCartToLocal();
        }
        
        function updateItemQuantity(index, newQuantity) {
            if (newQuantity <= 0) {
                removeItemFromCart(index);
            } else {
                shoppingCart[index].quantity = newQuantity;
                saveCartToLocal();
            }
        }
        
        function getCartTotalAmount() {
            return shoppingCart.reduce((total, item) => total + (item.price * item.quantity), 0);
        }
        
        function getCartItemTotalCount() {
            return shoppingCart.reduce((count, item) => count + item.quantity, 0);
        }
        
        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const totalSpan = document.getElementById('cartTotal');
            const countSpan = document.getElementById('cartCount');
            
            if (countSpan) countSpan.textContent = getCartItemTotalCount();
            if (totalSpan) totalSpan.textContent = `$${getCartTotalAmount().toFixed(2)}`;
            
            if (!container) return;
            
            if (shoppingCart.length === 0) {
                container.innerHTML = `<div class="empty-cart"><i class="fas fa-shopping-basket"></i><p>Tu carrito está vacío</p></div>`;
                return;
            }
            
            container.innerHTML = shoppingCart.map((item, index) => `
                <div class="cart-item">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>$${item.price.toFixed(2)} c/u</small>
                        </div>
                        <div>$${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:10px;">
                        <div>
                            <button onclick="window.updateItemQuantity(${index}, ${item.quantity - 1})" style="background:#BA6990; border:none; width:30px; border-radius:50%; cursor:pointer;">-</button>
                            <span style="margin:0 10px;">${item.quantity}</span>
                            <button onclick="window.updateItemQuantity(${index}, ${item.quantity + 1})" style="background:#BA6990; border:none; width:30px; border-radius:50%; cursor:pointer;">+</button>
                        </div>
                        <button onclick="window.removeItemFromCart(${index})" style="background:none; border:none; color:#ff6b6b; cursor:pointer;">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }
        
        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.background = isError ? '#f44336' : '#4CAF50';
            notification.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ==================== FACTURA ====================
        let lastInvoice = null;
        
        function generateInvoice(orderId, items, total) {
            const now = new Date();
            const invoiceNumber = `INV-${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}-${Math.floor(Math.random()*10000)}`;
            
            const invoiceHtml = `
                <div style="background:white; color:black; padding:20px; border-radius:20px; max-width:400px; margin:0 auto;">
                    <div style="text-align:center; border-bottom:2px solid #DB3606; padding-bottom:10px; margin-bottom:15px;">
                        <h2 style="color:#DB3606;">🌿 LUCY'S YARD</h2>
                        <p>Allen, TX | 1070 Watters Creek Blvd</p>
                    </div>
                    <div style="background:#f5f5f5; padding:10px; text-align:center; border-radius:8px; margin:10px 0;">
                        <strong>FACTURA:</strong> ${invoiceNumber}<br>
                        <strong>ORDEN:</strong> ${orderId}<br>
                        <strong>FECHA:</strong> ${now.toLocaleString('es-ES')}<br>
                        <strong>MESA:</strong> QR-MESA
                    </div>
                    <div>
                        ${items.map(item => `
                            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #ddd;">
                                <span>${item.name} x${item.quantity}</span>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top:15px; padding-top:10px; border-top:2px solid #DB3606; font-weight:bold; display:flex; justify-content:space-between;">
                        <span>TOTAL PAGADO</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <div style="margin-top:15px; text-align:center; font-size:12px;">
                        <p>✅ PAGO CONFIRMADO</p>
                        <p>Tiempo estimado: 15-20 minutos</p>
                        <p>¡Gracias por tu compra!</p>
                    </div>
                </div>
            `;
            
            lastInvoice = { html: invoiceHtml, number: invoiceNumber };
            
            const modal = document.createElement('div');
            modal.id = 'dynamicInvoiceModal';
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:6000; display:flex; align-items:center; justify-content:center; flex-direction:column;';
            modal.innerHTML = invoiceHtml + `
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button onclick="this.parentElement.parentElement.remove()" style="padding:10px 20px; background:#BA6990; border:none; border-radius:30px; color:white; font-weight:bold;">Cerrar</button>
                    <button onclick="printInvoice()" style="padding:10px 20px; background:#DB3606; border:none; border-radius:30px; color:white; font-weight:bold;">🖨️ Imprimir</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        function printInvoice() {
            if (!lastInvoice) return;
            const win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Factura ${lastInvoice.number}</title>
                <style>
                    body { font-family: 'Poppins', sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
                    button { display: none; }
                </style>
                </head><body>${lastInvoice.html}</body></html>
            `);
            win.document.close();
            win.print();
        }
        
        // ==================== ENVIAR PEDIDO A SUPABASE ====================
        async function sendOrderToCloud(orderData) {
            try {
                console.log('📤 Enviando pedido a Supabase...', orderData);
                
                const orderToSave = {
                    order_id: orderData.orderId,
                    customer_name: 'Cliente QR',
                    table_number: 'Mesa QR',
                    items: orderData.items,
                    total: orderData.total,
                    location: 'Allen - Lucy\'s Yard',
                    status: 'pending'
                };
                
                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([orderToSave])
                    .select();
                
                if (error) {
                    console.error('❌ Error Supabase:', error);
                    showNotification(`Error: ${error.message}`, true);
                    return { success: false, error: error.message };
                }
                
                console.log('✅ Pedido guardado en la nube:', data);
                showNotification(`✅ Pedido enviado a cocina!`);
                return { success: true, data: data };
                
            } catch (error) {
                console.error('❌ Error:', error);
                showNotification('Error al conectar con servidor', true);
                return { success: false, error: error.message };
            }
        }
        
        // ==================== SIMULAR PAGO ====================
        async function processPayment(total) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        success: true,
                        transactionId: `ORD-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
                        amount: total
                    });
                }, 1000);
            });
        }
        
        // ==================== CHECKOUT ====================
        async function checkout() {
            if (shoppingCart.length === 0) {
                showNotification('El carrito está vacío', true);
                return;
            }
            
            const total = getCartTotalAmount();
            const location = 'Allen - Lucy\'s Yard';
            
            showNotification('Procesando pago...');
            
            try {
                const payment = await processPayment(total);
                
                if (!payment.success) {
                    showNotification('Error en el pago', true);
                    return;
                }
                
                showNotification(`✅ Pago aprobado!`);
                
                const orderData = {
                    orderId: payment.transactionId,
                    items: shoppingCart.map(item => ({
                        name: item.name,
                        quantity: item.quantity,
                        price: item.price,
                        subtotal: item.price * item.quantity
                    })),
                    total: total,
                    location: location,
                    tableNumber: 'QR-MESA'
                };
                
                const result = await sendOrderToCloud(orderData);
                
                if (result.success) {
                    generateInvoice(payment.transactionId, shoppingCart, total);
                    shoppingCart = [];
                    saveCartToLocal();
                    
                    document.getElementById('cartModal').classList.remove('active');
                    document.body.style.overflow = 'auto';
                    
                    showNotification(`🎉 Pedido #${payment.transactionId.slice(-6)} enviado a cocina!`);
                    
                    console.log('========== COMANDA LUCYS YARD ==========');
                    console.log(`Orden: ${payment.transactionId}`);
                    console.log('Productos:', orderData.items);
                    console.log(`Total: $${total}`);
                    console.log('=========================================');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error al procesar el pedido', true);
            }
        }
        
        // ==================== RENDERIZAR MENÚ ====================
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (!container) return;
            
            // Agrupar por categorías
            const categories = [...new Set(menuItems.map(item => item.category))];
            let html = '';
            
            categories.forEach(category => {
                const items = menuItems.filter(item => item.category === category);
                const isBrunch = category === 'Brunch';
                
                html += `<h2 class="section-title">${category}</h2>`;
                if (isBrunch) {
                    html += `<div class="brunch-banner"><p>🌿 SOLO FINES DE SEMANA • 9:00 AM - 4:00 PM 🌿</p></div>`;
                }
                html += `<div class="menu-grid">`;
                
                items.forEach(item => {
                    const priceDisplay = item.priceText ? item.priceText : `$${item.price.toFixed(2)}`;
                    html += `
                        <div class="menu-card">
                            <img src="${item.image}" alt="${item.name}" class="card-image" onerror="this.src='https://placehold.co/400x300?text=Lucy%27s+Yard'">
                            <div class="card-content">
                                <h3>${item.name} ${item.badge ? `<span class="badge">${item.badge}</span>` : ''}</h3>
                                <p>${item.description}</p>
                                <div class="price-row">
                                    <span class="price">${priceDisplay}</span>
                                    <button class="add-to-cart" onclick='window.addItemToCart(${JSON.stringify(item).replace(/'/g, "\\'")})'>
                                        <i class="fas fa-plus"></i> Agregar
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
            console.log('✅ Menú renderizado con', menuItems.length, 'productos');
        }
        
        // ==================== UI INTERACCIONES ====================
        function openCartModal() {
            const modal = document.getElementById('cartModal');
            if (modal) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        
        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            if (modal) {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        
        // ==================== EXPONER FUNCIONES GLOBALES ====================
        window.addItemToCart = addItemToCart;
        window.removeItemFromCart = removeItemFromCart;
        window.updateItemQuantity = updateItemQuantity;
        window.printInvoice = printInvoice;
        
        // ==================== INICIAR APLICACIÓN ====================
        function initApp() {
            renderMenu();
            updateCartUI();
            
            const openBtn = document.getElementById('openCartBtn');
            const closeBtn = document.getElementById('closeCartBtn');
            const checkoutBtn = document.getElementById('checkoutBtn');
            
            if (openBtn) openBtn.addEventListener('click', openCartModal);
            if (closeBtn) closeBtn.addEventListener('click', closeCartModal);
            if (checkoutBtn) checkoutBtn.addEventListener('click', checkout);
            
            console.log('🚀 Lucy\'s Yard QR Menu listo!');
            console.log('📦 Total productos:', menuItems.length);
        }
        
        initApp();
    </script>
</body>
