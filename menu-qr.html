        // ==================== CARRITO ====================
        let carrito = JSON.parse(localStorage.getItem('carrito_lucys')) || [];
        let ultimaFactura = null;
        
        function guardarCarrito() {
            localStorage.setItem('carrito_lucys', JSON.stringify(carrito));
            actualizarCarritoUI();
        }
        
        // Función GLOBAL para agregar al carrito
        window.agregarAlCarrito = function(producto) {
            console.log('Agregando:', producto);
            if (producto.special) {
                window.mostrarNotificacion('El especial del chef varía cada semana', true);
                return;
            }
            const existe = carrito.find(i => i.id === producto.id);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            guardarCarrito();
            window.mostrarNotificacion(`${producto.name} agregado`);
        };
        
        window.eliminarDelCarrito = function(indice) {
            carrito.splice(indice, 1);
            guardarCarrito();
        };
        
        window.actualizarCantidad = function(indice, nuevaCantidad) {
            if (nuevaCantidad <= 0) {
                window.eliminarDelCarrito(indice);
            } else {
                carrito[indice].cantidad = nuevaCantidad;
                guardarCarrito();
            }
        };
        
        function totalCarrito() {
            return carrito.reduce((t, i) => t + (i.price * i.cantidad), 0);
        }
        
        function cantidadTotal() {
            return carrito.reduce((c, i) => c + i.cantidad, 0);
        }
        
        function actualizarCarritoUI() {
            const contenedor = document.getElementById('cartItemsList');
            const totalSpan = document.getElementById('cartTotal');
            const contadorSpan = document.getElementById('cartCount');
            
            if (contadorSpan) contadorSpan.textContent = cantidadTotal();
            if (totalSpan) totalSpan.textContent = `$${totalCarrito().toFixed(2)}`;
            
            if (!contenedor) return;
            
            if (carrito.length === 0) {
                contenedor.innerHTML = `<div class="empty-cart">Tu carrito está vacío</div>`;
                return;
            }
            
            contenedor.innerHTML = carrito.map((item, idx) => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <span class="cart-item-name">${item.name}</span>
                        <span>$${(item.price * item.cantidad).toFixed(2)}</span>
                    </div>
                    <div class="cart-item-controls">
                        <div class="qty-control">
                            <button class="qty-btn" onclick="window.actualizarCantidad(${idx}, ${item.cantidad - 1})">-</button>
                            <span>${item.cantidad}</span>
                            <button class="qty-btn" onclick="window.actualizarCantidad(${idx}, ${item.cantidad + 1})">+</button>
                        </div>
                        <button class="remove-item" onclick="window.eliminarDelCarrito(${idx})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }
        
        window.mostrarNotificacion = function(mensaje, error = false) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = error ? '#f44336' : '#4CAF50';
            notif.innerHTML = `<i class="fas ${error ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${mensaje}`;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2500);
        };
        
        // ==================== SUPABASE ====================
        async function enviarACocina(orderId, items, total) {
            try {
                const datos = {
                    order_id: orderId,
                    customer_name: 'Cliente QR',
                    table_number: 'Mesa QR',
                    items: items.map(i => ({ name: i.name, quantity: i.cantidad, price: i.price, subtotal: i.price * i.cantidad })),
                    total: total,
                    location: 'Allen - Lucy\'s Yard',
                    status: 'pending'
                };
                const { error } = await supabaseClient.from('orders').insert([datos]);
                if (error) throw error;
                return true;
            } catch(e) {
                console.error(e);
                return false;
            }
        }
        
        // ==================== FACTURA ====================
        function generarFactura(orderId, items, total) {
            const ahora = new Date();
            const numFactura = `INV-${ahora.getFullYear()}${(ahora.getMonth()+1).toString().padStart(2,'0')}${ahora.getDate().toString().padStart(2,'0')}-${Math.floor(Math.random()*10000)}`;
            
            const html = `
                <div class="invoice-header">
                    <h2>🌿 LUCY'S YARD</h2>
                    <p>Allen, TX | 1070 Watters Creek Blvd</p>
                </div>
                <div class="invoice-number">
                    <strong>FACTURA:</strong> ${numFactura}<br>
                    <strong>ORDEN:</strong> ${orderId}<br>
                    <strong>FECHA:</strong> ${ahora.toLocaleString('es-ES')}<br>
                    <strong>MESA:</strong> QR-MESA
                </div>
                <div>
                    ${items.map(item => `
                        <div class="invoice-item">
                            <span>${item.name} x${item.cantidad}</span>
                            <span>$${(item.price * item.cantidad).toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="invoice-total">
                    <span>TOTAL PAGADO</span>
                    <span>$${total.toFixed(2)}</span>
                </div>
                <div style="margin-top:0.8rem; text-align:center; font-size:0.65rem;">
                    <p>✅ PAGO CONFIRMADO</p>
                    <p>Tiempo estimado: 15-20 minutos</p>
                </div>
            `;
            
            ultimaFactura = { html, numero: numFactura };
            
            const contenedor = document.getElementById('invoiceContent');
            contenedor.innerHTML = html + `
                <div class="invoice-buttons">
                    <button class="invoice-btn invoice-close" onclick="window.cerrarFactura()">Cerrar</button>
                    <button class="invoice-btn invoice-print" onclick="window.imprimirFactura()">🖨️ Imprimir</button>
                </div>
            `;
            
            document.getElementById('invoiceModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        window.cerrarFactura = function() {
            document.getElementById('invoiceModal').classList.remove('active');
            document.body.style.overflow = '';
        };
        
        window.imprimirFactura = function() {
            if (!ultimaFactura) return;
            const ventana = window.open('', '_blank');
            ventana.document.write(`
                <html><head><title>Factura ${ultimaFactura.numero}</title>
                <style>
                    body { font-family: 'Poppins', sans-serif; padding: 1rem; max-width: 400px; margin: 0 auto; }
                    .invoice-header { text-align: center; border-bottom: 2px solid #DB3606; }
                    .invoice-header h2 { color: #DB3606; }
                    .invoice-number { background: #f5f5f5; padding: 0.5rem; text-align: center; margin: 1rem 0; }
                    .invoice-item { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px dashed #ddd; }
                    .invoice-total { margin-top: 1rem; padding-top: 0.5rem; border-top: 2px solid #DB3606; display: flex; justify-content: space-between; font-weight: bold; }
                    @media print { button { display: none; } }
                </style>
                </head><body>${ultimaFactura.html}</body></html>
            `);
            ventana.document.close();
            ventana.print();
        };
        
        // ==================== CHECKOUT ====================
        async function finalizarPedido() {
            if (carrito.length === 0) {
                window.mostrarNotificacion('Carrito vacío', true);
                return;
            }
            
            const total = totalCarrito();
            const orderId = `ORD-${Date.now()}-${Math.floor(Math.random()*1000)}`;
            
            window.mostrarNotificacion('Procesando pago...');
            
            const enviado = await enviarACocina(orderId, carrito, total);
            
            if (enviado) {
                generarFactura(orderId, carrito, total);
                carrito = [];
                guardarCarrito();
                cerrarCarrito();
                window.mostrarNotificacion(`🎉 Pedido #${orderId.slice(-6)} enviado a cocina!`);
            } else {
                window.mostrarNotificacion('Error al enviar pedido', true);
            }
        }
        
        // ==================== RENDERIZAR MENÚ ====================
        function renderizarMenu() {
            const contenedor = document.getElementById('menuContainer');
            if (!contenedor) return;
            
            const categorias = [];
            for (let i = 0; i < menuData.length; i++) {
                if (!categorias.includes(menuData[i].category)) {
                    categorias.push(menuData[i].category);
                }
            }
            
            let html = '';
            
            for (let c = 0; c < categorias.length; c++) {
                const categoria = categorias[c];
                const esBrunch = categoria === 'Brunch';
                
                html += `<h2 class="category-title">${categoria}</h2>`;
                if (esBrunch) {
                    html += `<div class="brunch-banner"><p>🌿 SOLO FINES DE SEMANA • 9AM - 4PM 🌿</p></div>`;
                }
                html += `<div class="menu-grid">`;
                
                for (let i = 0; i < menuData.length; i++) {
                    const producto = menuData[i];
                    if (producto.category !== categoria) continue;
                    
                    const precioMostrar = producto.special ? 'Precio del mercado' : `$${producto.price.toFixed(2)}`;
                    
                    html += `
                        <div class="menu-card">
                            <img src="${producto.img}" class="card-image" onerror="this.src='https://placehold.co/400x300?text=Lucy%27s+Yard'">
                            <div class="card-content">
                                <h3>${producto.name}${producto.badge ? `<span class="badge">Brunch</span>` : ''}</h3>
                                <p>${producto.desc}</p>
                                <div class="price-row">
                                    <span class="price">${precioMostrar}</span>
                                    ${!producto.special ? `<button class="add-btn" onclick="window.agregarAlCarrito(${JSON.stringify(producto).replace(/'/g, "\\'")})">
                                        <i class="fas fa-plus"></i> Agregar
                                    </button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                html += `</div>`;
            }
            
            contenedor.innerHTML = html;
            console.log('✅ Menú renderizado con', menuData.length, 'productos');
        }
        
        // ==================== MODALES ====================
        function abrirCarrito() {
            document.getElementById('cartModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function cerrarCarrito() {
            document.getElementById('cartModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // ==================== INICIAR ====================
        document.getElementById('openCartBtn').onclick = abrirCarrito;
        document.getElementById('closeCartBtn').onclick = cerrarCarrito;
        document.getElementById('checkoutBtn').onclick = finalizarPedido;
        
        renderizarMenu();
        actualizarCarritoUI();
        
        console.log('✅ Lucy\'s Yard QR Menu listo!');
        console.log(`📦 ${menuData.length} productos cargados`);
        console.log('📡 Conectado a Supabase');
    </script>
</body>
</html>
